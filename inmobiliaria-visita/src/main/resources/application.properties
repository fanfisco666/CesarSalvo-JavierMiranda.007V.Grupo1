spring.application.name=inmobiliaria-visita
server.port=8084

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/inmobiliaria_visitas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Chochex1367*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
