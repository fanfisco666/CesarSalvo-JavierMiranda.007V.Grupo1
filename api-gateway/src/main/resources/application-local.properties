#para el Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Registrar cada microservicio como una "fuente" de documentación
springdoc.swagger-ui.urls[0].name=Clientes
springdoc.swagger-ui.urls[0].url=/inmobiliaria-cliente/v3/api-docs

springdoc.swagger-ui.urls[1].name=Propiedades
springdoc.swagger-ui.urls[1].url=/inmobiliaria-propiedad/v3/api-docs

springdoc.swagger-ui.urls[2].name=Agentes
springdoc.swagger-ui.urls[2].url=/inmobiliaria-agente/v3/api-docs

springdoc.swagger-ui.urls[3].name=Visitas
springdoc.swagger-ui.urls[3].url=/inmobiliaria-visita/v3/api-docs

springdoc.swagger-ui.urls[4].name=Contratos
springdoc.swagger-ui.urls[4].url=/inmobiliaria-contrato/v3/api-docs

springdoc.swagger-ui.urls[5].name=Pagos
springdoc.swagger-ui.urls[5].url=/inmobiliaria-pago/v3/api-docs

springdoc.swagger-ui.urls[6].name=Notificaciones
springdoc.swagger-ui.urls[6].url=/inmobiliaria-notificacion/v3/api-docs

springdoc.swagger-ui.urls[7].name=Autenticación
springdoc.swagger-ui.urls[7].url=/inmobiliaria-auth/v3/api-docs

springdoc.swagger-ui.urls[8].name=Reportes
springdoc.swagger-ui.urls[8].url=/inmobiliaria-reporte/v3/api-docs

springdoc.swagger-ui.urls[9].name=Mantenciones
springdoc.swagger-ui.urls[9].url=/inmobiliaria-mantencion/v3/api-docs


# Rutas para exponer el JSON de OpenAPI de cada microservicio

