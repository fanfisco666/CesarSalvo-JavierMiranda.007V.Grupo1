server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# inmobiliaria-agente
spring.cloud.gateway.routes[0].id=inmobiliaria-agente
spring.cloud.gateway.routes[0].uri=lb://INMOBILIARIA-AGENTE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/agente/**

