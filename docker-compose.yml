    container_name: mysql-visitas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_visitas_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_visitas_data:/var/lib/mysql

  # BD de contratos
  mysql-contratos:
    image: mysql:8.0
    container_name: mysql-contratos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_contratos_db
    ports:
      - "3312:3306"
    volumes:
      - mysql_contratos_data:/var/lib/mysql

  # BD de pagos
  mysql-pagos:
    image: mysql:8.0
    container_name: mysql-pagos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_pagos_db
    ports:
      - "3313:3306"
