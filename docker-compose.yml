  inmobiliaria-reporte:
    build: ./inmobiliaria-reporte
    container_name: inmobiliaria-reporte
    restart: always
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reportes:3306/inmobiliaria_reportes_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-reportes:
        condition: service_healthy

  inmobiliaria-mantencion:
    build: ./inmobiliaria-mantencion
    container_name: inmobiliaria-mantencion
    restart: always
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-mantenciones:3306/inmobiliaria_mantenciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-mantenciones:
        condition: service_healthy

volumes:
  mysql_clientes_data:
  mysql_auth_data:
  mysql_propiedades_data:
  mysql_agentes_data:
  mysql_visitas_data:
  mysql_contratos_data:
  mysql_pagos_data:
  mysql_notificaciones_data:
  mysql_reportes_data:
  mysql_mantenciones_data: