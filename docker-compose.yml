      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_notificaciones_db
    ports:
      - "3314:3306"
    volumes:
      - mysql_notificaciones_data:/var/lib/mysql

  # BD de reportes
  mysql-reportes:
    image: mysql:8.0
    container_name: mysql-reportes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_reportes_db
    ports:
      - "3315:3306"
