version: '3.8'

services:

  # BD de clientes
  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_clientes_data:/var/lib/mysql

  # BD de auth
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_auth_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql

  # BD de propiedades (compañero)
  mysql-propiedades:
    image: mysql:8.0
    container_name: mysql-propiedades
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_propiedades_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_propiedades_data:/var/lib/mysql

  # BD de agentes (compañero)
