version: '3.8'
services:

  # ── BASES DE DATOS ──────────────────────────────────────

  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_clientes_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15    # <--- Subido de 5 a 15 para dar más tiempo de inicialización en paralelo

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-propiedades:
    image: mysql:8.0
    container_name: mysql-propiedades
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_propiedades_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_propiedades_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-agentes:
    image: mysql:8.0
    container_name: mysql-agentes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_agentes_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_agentes_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-visitas:
    image: mysql:8.0
    container_name: mysql-visitas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_visitas_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_visitas_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-contratos:
    image: mysql:8.0
    container_name: mysql-contratos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_contratos_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_contratos_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-pagos:
    image: mysql:8.0
    container_name: mysql-pagos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_pagos_db
    ports:
      - "3312:3306"
    volumes:
      - mysql_pagos_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-notificaciones:
    image: mysql:8.0
    container_name: mysql-notificaciones
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_notificaciones_db
    ports:
      - "3313:3306"
    volumes:
      - mysql_notificaciones_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-reportes:
    image: mysql:8.0
    container_name: mysql-reportes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_reportes_db
    ports:
      - "3314:3306"
    volumes:
      - mysql_reportes_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  mysql-mantenciones:
    image: mysql:8.0
    container_name: mysql-mantenciones
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chochex1367*
      MYSQL_DATABASE: inmobiliaria_mantenciones_db
    ports:
      - "3315:3306"
    volumes:
      - mysql_mantenciones_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChochex1367*" ]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── MICROSERVICIOS ──────────────────────────────────────

  inmobiliaria-auth:
    build: ./inmobiliaria-auth
    container_name: inmobiliaria-auth
    restart: always
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/inmobiliaria_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-auth:
        condition: service_healthy

  inmobiliaria-cliente:
    build: ./inmobiliaria_cliente
    container_name: inmobiliaria-cliente
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-clientes:3306/inmobiliaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-clientes:
        condition: service_healthy

  inmobiliaria-propiedad:
    build: ./inmobiliaria-propiedad
    container_name: inmobiliaria-propiedad
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-propiedades:3306/inmobiliaria_propiedades_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-propiedades:
        condition: service_healthy

  inmobiliaria-agente:
    build: ./inmobiliaria-agente
    container_name: inmobiliaria-agente
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-agentes:3306/inmobiliaria_agentes_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-agentes:
        condition: service_healthy

  inmobiliaria-notificacion:
    build: ./inmobiliaria-notificacion
    container_name: inmobiliaria-notificacion
    restart: always
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notificaciones:3306/inmobiliaria_notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-notificaciones:
        condition: service_healthy

  inmobiliaria-visita:
    build: ./inmobiliaria-visita
    container_name: inmobiliaria-visita
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-visitas:3306/inmobiliaria_visitas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-visitas:
        condition: service_healthy
      inmobiliaria-cliente:
        condition: service_started
      inmobiliaria-propiedad:
        condition: service_started
      inmobiliaria-agente:
        condition: service_started
      inmobiliaria-notificacion:
        condition: service_started

  inmobiliaria-contrato:
    build: ./inmobiliaria-contrato
    container_name: inmobiliaria-contrato
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-contratos:3306/inmobiliaria_contratos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-contratos:
        condition: service_healthy
      inmobiliaria-visita:
        condition: service_started
      inmobiliaria-cliente:
        condition: service_started
      inmobiliaria-propiedad:
        condition: service_started
      inmobiliaria-agente:
        condition: service_started
      inmobiliaria-notificacion:
        condition: service_started

  inmobiliaria-pago:
    build: ./inmobiliaria-pago
    container_name: inmobiliaria-pago
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagos:3306/inmobiliaria_pagos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chochex1367*
    depends_on:
      mysql-pagos:
        condition: service_healthy
      inmobiliaria-contrato:
        condition: service_started
      inmobiliaria-cliente:
        condition: service_started
      inmobiliaria-notificacion:
