# Configuraci�n para MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/inmobiliaria_reporte_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
